name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall app.py aifa_catalog.py barcode_scanner.py database.py medicine_core.py medicine_service.py pdf_report.py
      - run: python -m pytest -q
      - run: pip check
      - run: pip-audit
