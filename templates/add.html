{% extends 'base.html' %}
{% block title %}Aggiungi farmaco · I miei farmaci{% endblock %}
{% block content %}
<section class="form-card card">
  <div class="form-heading">
    <div>
      <p class="eyebrow">Nuovo elemento</p>
      <h1>Aggiungi farmaco</h1>
      <p class="muted">Puoi inserire il codice AIC per recuperare automaticamente i dati dall'archivio locale.</p>
    </div>
    <a class="secondary-link" href="{{ url_for('dashboard') }}">Torna alla dashboard</a>
  </div>

  <form method="post" class="form-grid two-cols" id="farmaco-form">
    <label>Codice AIC
      <div class="inline-field">
        <input type="text" name="aic" id="aic" inputmode="numeric" placeholder="es. 012345678">
        <button type="button" class="secondary-button" id="lookup-aic">Cerca</button>
      </div>
      <small id="aic-status" class="hint"></small>
    </label>

    <label>Nome farmaco
      <input type="text" name="nome" id="nome" required>
    </label>

    <label class="full">Descrizione
      <input type="text" name="descrizione" id="descrizione">
    </label>

    <label class="full">Principio attivo
      <input type="text" name="principio_attivo" id="principio_attivo">
    </label>

    <label>Quantità
      <input type="number" name="quantita" min="0" value="1" required>
    </label>

    <label>Unità
      <select name="tipo" required>
        <option value="Pezzi">Pezzi</option>
        <option value="Compresse">Compresse</option>
        <option value="Bustine">Bustine</option>
        <option value="Flaconi">Flaconi</option>
        <option value="Confezioni">Confezioni</option>
        <option value="ml">ml</option>
      </select>
    </label>

    <label>Scadenza (mese)
      <input type="month" name="scadenza" required>
    </label>

    <div class="actions full">
      <button type="submit">Salva farmaco</button>
      <a class="secondary-link" href="{{ url_for('dashboard') }}">Annulla</a>
    </div>
  </form>
</section>

<script>
document.getElementById('lookup-aic').addEventListener('click', async () => {
  const code = document.getElementById('aic').value.trim();
  const status = document.getElementById('aic-status');
  if (!code) {
    status.textContent = 'Inserisci un codice AIC.';
    return;
  }
  status.textContent = 'Ricerca in corso…';
  try {
    const response = await fetch('/api/get_farmaco/' + encodeURIComponent(code));
    const data = await response.json();
    if (!data.success) {
      status.textContent = 'Farmaco non trovato nell’archivio AIFA locale.';
      return;
    }
    document.getElementById('aic').value = data.aic || code;
    document.getElementById('nome').value = data.nome || '';
    document.getElementById('descrizione').value = data.nome || '';
    document.getElementById('principio_attivo').value = data.principio_attivo || '';
    status.textContent = data.ditta ? 'Trovato · ' + data.ditta : 'Farmaco trovato.';
  } catch (error) {
    status.textContent = 'Errore durante la ricerca.';
  }
});
</script>
{% endblock %}
