{% extends 'base.html' %}
{% block title %}Accedi · I miei farmaci{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="logo-mark">Rx</div>
  <h1>Accedi</h1>
  <p class="muted">Gestisci i tuoi farmaci, le quantità e le scadenze.</p>
  <form method="post" class="form-grid">
    <label>Nome utente
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Accedi</button>
  </form>
  <p class="auth-link">Non hai un account? <a href="{{ url_for('register') }}">Registrati</a></p>
</section>
{% endblock %}
