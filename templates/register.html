{% extends 'base.html' %}
{% block title %}Registrati · I miei farmaci{% endblock %}
{% block content %}
<section class="auth-card">
  <div class="logo-mark">Rx</div>
  <h1>Crea account</h1>
  <p class="muted">I tuoi farmaci restano associati al tuo profilo.</p>
  <form method="post" class="form-grid">
    <label>Nome utente
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>Email
      <input type="email" name="email" autocomplete="email" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit">Registrati</button>
  </form>
  <p class="auth-link">Hai già un account? <a href="{{ url_for('login') }}">Accedi</a></p>
</section>
{% endblock %}
